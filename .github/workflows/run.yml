name: 한국장 랭킹 순위

on:
  # GitHub 자체 schedule은 제거했습니다. cron-job.org와 중복 실행되기 때문입니다.
  repository_dispatch:
    types: [run-cron]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / rank / news"
        default: "auto"

permissions:
  contents: write   # last_rank.json 커밋용

concurrency:
  group: korea-stock-rank-top20
  cancel-in-progress: false

jobs:
  send-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python main.py

      - name: 순위 종목 저장 (홀수 시 실행분)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_rank.json || true
          git diff --cached --quiet || (git commit -m "update last_rank" && git push)
