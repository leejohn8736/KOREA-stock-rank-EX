name: 한국장 랭킹 순위

on:
  schedule:
    # 한국시간(KST, UTC+9) 매일 08:00 ~ 21:00 매시 정각 실행 (총 14회)
    # KST 08:00 = UTC 23:00 (전날)
    # KST 09:00 ~ 21:00 = UTC 00:00 ~ 12:00
    - cron: "0 23,0-12 * * *"
  repository_dispatch:
    types: [run-cron] # cron-job.org API 호출용
  workflow_dispatch: # Actions 탭에서 수동 테스트 실행 가능

concurrency:
  group: korea-stock-rank-top20
  cancel-in-progress: true

jobs:
  send-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 한국장 랭킹 순위 발송 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
