name: 한국장 랭킹 순위

on:
  schedule:
    # 한국시간(KST, UTC+9) 매일 오전 7시 50분 = UTC 22:50
    - cron: "50 22 * * *"
  workflow_dispatch: # Actions 탭에서 수동 테스트 실행 가능

jobs:
  send-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 한국장 랭킹 순위 발송 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
